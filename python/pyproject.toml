[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ffxiv-minion-mcp"
version = "0.1.0"
description = "MCP server for executing Lua in FFXIVMinion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Noobgam" }]
dependencies = [
    "mcp>=1.9,<2",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ffxiv-minion-mcp = "ffxiv_minion_mcp.server:run"
ffxiv-minion-lua = "ffxiv_minion_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ffxiv_minion_mcp"]
